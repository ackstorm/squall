# The dstack.database.existingSecret Secret deploy/helm/squall's
# dstack-deployment.yaml wires into DSTACK_DATABASE_URL via secretKeyRef —
# never a values.yaml literal (see values.yaml's dstack.database comment).
#
# Fixed, obviously-fake e2e-only credential (matches postgres_deployment.yaml
# and the house rule on e2e tokens) — asyncpg is already installed in
# dstackai/dstack:0.21.2, no image change needed.
---
apiVersion: v1
kind: Secret
metadata:
  name: squall-postgres-credentials
  labels:
    app.kubernetes.io/name: squall
    app.kubernetes.io/component: dstack
    app.kubernetes.io/managed-by: kustomize
stringData:
  database-url: postgresql+asyncpg://dstack:dstack@squall-postgres.squall-system.svc.cluster.local:5432/dstack
