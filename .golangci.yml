version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    # gosec is a HIGH-only gate: HIGH findings block CI; MEDIUM/LOW are
    # reported but non-blocking. The explicit `includes` list pins the reviewed
    # rule subset so a new upstream gosec rule cannot silently turn CI red.
    # G105 is omitted: reserved / withdrawn upstream.
    # G115 (integer-overflow conversion) is omitted: its reachable findings
    # carry `// #nosec G115` annotations with documented upper bounds.
    gosec:
      includes:
        - G101
        - G102
        - G103
        - G104
        - G106
        - G107
        - G108
        - G109
        - G110
        - G201
        - G202
        - G203
        - G204
        - G304
        - G401
        - G402
        - G403
        - G404
        - G501
        - G502
        - G503
        - G504
        - G505
      severity: high
      confidence: low
    # Parity with the v1 linter set: v2 folds stylecheck (ST*) and quickfix
    # (QF*) into staticcheck; only SA* (v1 staticcheck) and S1* (v1 gosimple)
    # were ever enabled here.
    staticcheck:
      checks:
        - SA*
        - S1*
    # goconst v2 also counts call arguments and composite literals
    # (Prometheus label lists, test tables); v1 counted neither.
    goconst:
      exclude-types:
        - Call
        - CompositeLit
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
