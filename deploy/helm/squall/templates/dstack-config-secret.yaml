apiVersion: v1
kind: Secret
metadata:
  name: dstack-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: squall
    app.kubernetes.io/component: dstack
    app.kubernetes.io/managed-by: {{ .Release.Service }}
stringData:
  # server/config.yml. namespace is deliberately NOT set on the backend
  # itself: KubernetesBackendConfig.namespace only applies when `contexts`
  # is unset, and using `contexts` (required to set proxy_jump) takes the
  # namespace from the kubeconfig context instead — see
  # docs/references/dstack-real-api.md §2.
  config.yml: |
    projects:
    - name: {{ .Values.dstack.projectName }}
      backends:
{{- if .Values.dstack.backends }}
{{- /*
  Passed through to dstack's server/config.yml VERBATIM (D84 — LIVE-7 item
  4): this template previously force-defaulted `community_cloud: false` for
  every vastai backend entry lacking the key, silently overriding dstack's
  OWN default (VASTAI_COMMUNITY_CLOUD_DEFAULT = True) with no measurement
  behind it. Whether Community Cloud (individual operators, cheaper,
  materially less reliable) is worth excluding is a real tradeoff — see
  values.yaml's vastai example — but it is the values file's decision to
  make, not this template's to impose.
*/}}
{{ toYaml .Values.dstack.backends | indent 6 }}
{{- else }}
      - type: kubernetes
        kubeconfig:
          filename: /etc/dstack/kubeconfig/kubeconfig
        contexts:
          - name: {{ .Values.dstack.kubernetes.contextName }}
            proxy_jump:
              hostname: {{ required "dstack.kubernetes.proxyJump.hostname is required when dstack.backends is empty (the in-cluster backend needs it; kind nodes have no ExternalIP)" .Values.dstack.kubernetes.proxyJump.hostname | quote }}
              port: {{ .Values.dstack.kubernetes.proxyJump.port }}
{{- end }}
{{- range $i, $f := .Values.dstack.fleets }}
  fleet-{{ $i }}.dstack.yml: |
    type: fleet
    name: {{ $f.name }}
    nodes: {{ $f.nodes | quote }}
    backends: {{ toYaml $f.backends | nindent 6 }}
    resources:
      cpu: {{ $f.resources.cpu | quote }}
      memory: {{ $f.resources.memory | quote }}
      disk: {{ $f.resources.disk | quote }}
{{- end }}
