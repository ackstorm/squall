  groups:
    - name: squall.model-metrics
      rules:
        - alert: SquallModelExceededMaxLifetime
          expr: squall_model_age_seconds > squall_model_max_lifetime_seconds
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Model {{ $labels.name }} has run past its declared maxLifetime
            description: >-
              spec.maxLifetime is ALERT-ONLY (§5.2) — nothing kills the run
              automatically. squall_model_age_seconds has exceeded
              squall_model_max_lifetime_seconds for 5m; decide by hand
              whether to recreate the run.
        - alert: SquallModelExceededMaxPricePerHour
          expr: squall_model_price_per_hour > squall_model_max_price_per_hour
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Model {{ $labels.name }}'s observed price exceeds its declared cap
            description: >-
              squall_model_price_per_hour (from dstack) has exceeded
              spec.placement.maxPricePerHour for 5m. Ledger D26: no
              production observed-price source exists yet, so this alert
              cannot fire until D26 is resolved.
        - alert: SquallModelProvisioningRetryLoop
          expr: increase(squall_model_provisioning_attempts_total[1h]) > 6
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Model {{ $labels.name }} keeps re-attempting provisioning
            description: >-
              provisioningTimeout (§5.2) destroys each wake that never reaches
              Ready, but demand re-arms the next one, and every attempt rents a
              machine until the deadline. Nothing in the controller bounds this
              loop: while callers keep retrying, spend continues. Measured
              2026-09-02: 4 deadline destroys and 14 recreates in one hour.
              Fix the cause (image, price cap, capacity) or stop the caller.
        - alert: SquallModelUncontrolledApproachingDeadline
          expr: squall_model_uncontrolled_seconds > 0.5 * squall_model_uncontrolled_timeout_seconds
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Model {{ $labels.name }} has been uncontrolled for half its deadline
            description: >-
              No proxy is reporting activity for a Model with live capacity, so
              the idle-sleep guardian has no evidence to act on. squall will
              flip it to zero at squall_model_uncontrolled_timeout_seconds; this
              fires early so the proxy outage is visible before that happens.
        - alert: SquallModelCapacityWhileNotReady
          expr: squall_model_run_active > max by (namespace, name) (squall_model_phase{phase="Ready"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Model {{ $labels.name }} holds capacity while not Ready
            description: >-
              A dstack run is active while the Model is not Ready — capacity
              that cannot serve a request but can still be billed. Expected
              briefly during a wake or a drain; sustained past 15m it means a
              stuck wake, a failed teardown, or an orphan the reaper has not
              swept.
